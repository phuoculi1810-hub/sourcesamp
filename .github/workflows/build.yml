name: Build ASI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code cua ban (WaypointRoute.cpp)
        uses: actions/checkout@v4
        with:
          path: myplugin
      - name: Checkout plugin-sdk chinh thuc
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk

      - name: Tai premake5.exe (ban Windows moi nhat)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/premake/premake-core/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows" } | Select-Object -First 1
          Write-Host "Tai ve: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "premake.zip"
          Expand-Archive -Path "premake.zip" -DestinationPath "premake-bin" -Force
          Copy-Item -Path "premake-bin\premake5.exe" -Destination "plugin-sdk\tools\premake\premake5.exe" -Force

      - name: Set bien moi truong PLUGIN_SDK_DIR
        shell: pwsh
        run: |
          $sdkPath = (Resolve-Path "plugin-sdk").Path
          Write-Host "PLUGIN_SDK_DIR = $sdkPath"
          echo "PLUGIN_SDK_DIR=$sdkPath" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # === Sinh solution static-lib chinh cua plugin-sdk (chua Plugin.lib cho GTA-SA) ===
      - name: Sinh solution static-lib chinh cua plugin-sdk (Plugin.lib cho GTA-SA)
        working-directory: plugin-sdk
        shell: cmd
        run: |
          tools\premake\premake5.exe --file="tools/premake/premake5.lua" --gtasa vs2022

      # === DEBUG: xem chinh xac Configuration/Platform hop le trong plugin.sln ===
      - name: DEBUG - In noi dung plugin.sln de xem config/platform hop le
        shell: pwsh
        run: |
          Write-Host "=== Noi dung plugin-sdk\plugin.sln ==="
          if (Test-Path "plugin-sdk\plugin.sln") {
            Get-Content "plugin-sdk\plugin.sln"
          } else {
            Write-Host "KHONG TIM THAY plugin-sdk\plugin.sln !"
            Write-Host "Liet ke moi file .sln trong plugin-sdk:"
            Get-ChildItem -Path "plugin-sdk" -Recurse -Filter "*.sln" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          }

      - name: Build Plugin.lib (Release, Mixed Platforms)
        shell: cmd
        run: |
          msbuild "plugin-sdk\plugin.sln" /p:Configuration=Release /p:Platform="Mixed Platforms" /t:Plugin_SA
          if errorlevel 1 exit /b 1

      - name: Kiem tra Plugin.lib da duoc build chua
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Path "plugin-sdk\output\lib" -Filter "Plugin.lib" -ErrorAction SilentlyContinue
          if (-not $lib) {
            Write-Error "KHONG tim thay Plugin.lib trong plugin-sdk\output\lib sau khi build."
            exit 1
          }
          Write-Host "Tim thay: $($lib.FullName)"

      - name: Sinh project moi bang premake5 chinh thuc cua plugin-sdk
        working-directory: plugin-sdk
        shell: cmd
        run: |
          tools\premake\premake5.exe --file="tools/premake/premake5.lua" --dir="../../../myplugin-generated" --name="WaypointRoute" --gtasa newplugin

      - name: DEBUG - Liet ke toan bo file da sinh ra
        shell: pwsh
        run: |
          Write-Host "=== Cay thu muc trong workspace ==="
          Get-ChildItem -Path "." -Recurse -Include "*.sln","*.vcxproj","*.cpp" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "plugin-sdk\\(shared|plugin_sa|plugin_iii|plugin_vc|plugin_iv|tools|examples)" } |
            ForEach-Object { Write-Host $_.FullName }

      - name: Kiem tra project da duoc sinh ra chua
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path "myplugin-generated" -Recurse -Filter "*.sln" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sln) {
            Write-Error "KHONG tim thay file .sln nao trong myplugin-generated. Buoc premake5 that bai hoac sai cu phap."
            exit 1
          }
          Write-Host "Tim thay solution: $($sln.FullName)"

      - name: Thay noi dung file .cpp mau bang code that cua ban
        shell: pwsh
        run: |
          $target = Get-ChildItem -Path "myplugin-generated" -Recurse -Filter "*.cpp" | Select-Object -First 1
          if (-not $target) {
            Write-Error "Khong tim thay file .cpp mau nao de ghi de."
            exit 1
          }
          Write-Host "Se ghi de vao file: $($target.FullName)"
          Copy-Item -Path "myplugin\src\WaypointRoute.cpp" -Destination $target.FullName -Force

      - name: Build bang MSBuild (Release, GTA-SA)
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FOUND=0
          for /r "myplugin-generated" %%f in (*.sln) do (
            set FOUND=1
            echo Building %%f
            msbuild "%%f" /p:Configuration=Release /p:Platform="GTA-SA"
            if errorlevel 1 exit /b 1
          )
          if !FOUND! == 0 (
            echo KHONG TIM THAY FILE .SLN NAO DE BUILD!
            exit /b 1
          )

      - name: Upload file .asi
        uses: actions/upload-artifact@v4
        with:
          name: WaypointRoute-asi
          path: myplugin-generated/**/*.asi
