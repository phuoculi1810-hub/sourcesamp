name: Build ASI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake (Win32)
        run: cmake -B build -A Win32

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload file .asi
        uses: actions/upload-artifact@v4
        with:
          name: WaypointRoute-asi
          path: build/Release/WaypointRoute.asi
